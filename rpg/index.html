<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>モドキクエストII 〜ふっかつのじゅもんはいらない〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- タイトル -->
<div id="title-screen">
  <div class="title-inner">
    <p class="title-sub">ドット絵コマンドRPG</p>
    <h1>モドキクエスト<span class="title-ii">II</span></h1>
    <p class="title-sub2">〜ふっかつのじゅもんは いらない〜</p>
    <div class="title-menu">
      <button id="start-btn">はじめから</button>
      <button id="continue-btn">つづきから</button>
    </div>
    <p class="title-help">
      そうさ: 矢印キー/WASDで いどう ・ ぶつかると はなす/しらべる<br>
      Enter/Z = けってい ・ Esc/X = メニュー/キャンセル<br>
      オートセーブつき。ぜんめつしても お金は へりません。
    </p>
  </div>
</div>

<!-- ゲーム本体 -->
<div id="game-ui" class="hidden">
  <div id="hud-top">
    <span id="hud-place"></span>
    <span id="hud-gold"></span>
  </div>
  <div id="screen-wrap">
    <canvas id="screen" width="480" height="352"></canvas>
    <div id="party-status"></div>
    <div id="msg-window" class="hidden">
      <div id="msg-text"></div>
      <div class="msg-next">▼</div>
    </div>
    <div id="list-window" class="hidden">
      <div id="list-title"></div>
      <div id="list-items"></div>
    </div>
  </div>
  <div id="hud-objective"></div>

  <div id="touch-pad">
    <div class="pad-grid">
      <span></span><button data-pad="up">▲</button><span></span>
      <button data-pad="left">◀</button><span></span><button data-pad="right">▶</button>
      <span></span><button data-pad="down">▼</button><span></span>
    </div>
    <div class="pad-ab">
      <button data-pad="b">B<small>メニュー</small></button>
      <button data-pad="a">A<small>はなす</small></button>
    </div>
  </div>
</div>

<!-- エンディング -->
<div id="ending-screen" class="hidden">
  <div class="title-inner">
    <h1 class="ending-fin">FIN</h1>
    <p class="title-sub2">そして でんせつは モドキになった…</p>
    <p id="ending-stats"></p>
    <div class="title-menu">
      <button id="ending-restart">タイトルへ</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
