# 鹿児島お宝再生物件ウォッチャー 設定
#
# 設計思想: 条件で落とさない。スコア化して並べ、人間が決める。
# slack_webhook_url は環境変数 SLACK_WEBHOOK_URL でも指定可能(環境変数推奨)。

db_path: data/listings.db

# 通知ゲート: 「何もない日は何も来ない」。値下げは原則即通知、
# 新着はスコア閾値以上のみ。土地のみ掲載は通知しない(台帳には残る)。
notify:
  min_score: 8          # 新着を即時通知する最低スコア
  ruin_extra_score: 5   # 倒壊級の記載がある物件に上乗せする閾値
  # まとめ送信: 1回の巡回で通知が何件出ても1通のメールにまとめる
  # (2026-08-01 ユーザー要望「メールが一気に何件も来て見づらい」)。
  # 定期便も同じメールに同梱し、台帳レポートも添付する。
  # false にすると従来の「1件1通」に戻る。
  bundle: true
  # 生存報告: 通知ゼロの日も1日1回だけ「動いています+いま熱い物件上位」を送る
  # (2026-07 ユーザー要望。falseにすると完全な「何もない日は何も来ない」に戻る)
  heartbeat: true
  # メール通知(自分宛てGmail)。アドレスは環境変数 GMAIL_USERNAME、
  # パスワードは環境変数 GMAIL_APP_PASSWORD から読む(公開リポジトリに
  # 個人情報を書かないため。GitHub Actions では Secrets で渡す)。
  email:
    username_env: GMAIL_USERNAME

# メール1タップの⭐キープ登録 (2026-08-02 ユーザー要望「スマホのメモに
# 書き写す手間をなくしたい」)。通知メールの「⭐キープ」リンクをタップ→
# 開いたメール(件名keep・本文=物件URL)をそのまま送信するだけで、
# 次の巡回から追跡リスト入り(⭐キープ・足切り免除・値下げ/掲載終了を即通知)。
# 一言メモを本文に足せばnoteに残る。Gmailのフィルタ設定は不要
# (「すべてのメール」を自動検出して検索する)。メールが正本なので、
# 台帳キャッシュが消えても次の巡回で自動復元される。
keep_mail:
  enabled: true
  subject_keyword: keep   # この件名で始まるメールだけ登録として読む
  lookback_days: 365      # 過去何日分のkeepメールを確認するか(自己修復の範囲)
  confirm_within_days: 7  # 受付報告を送るのはメール日付がこの日数以内の新規のみ

# 指値候補リスト: 値下げを「待つ」のではなく「起こす」ための攻めのリスト
offer_list:
  min_age_days: 90      # この日数以上の長期掲載を指値候補とみなす

# 官報チェック便: 週次ダイジェストに官報目次への直行リンクを載せる (半自動)。
# 官報サイトはクローラ禁止のため自動取得はしない。リンク生成のみ。
# 見方は docs/官報チェック手順書.html を参照。
kanpo:
  enabled: true

criteria:
  # 価格の足切り (2026-07 ユーザー判断)
  # 600〜700万の物件が100万になることはまずないので、高額と「応相談」は
  # 収集段階で外して時間の無駄を防ぐ。緩めたい場合は数字を上げる/trueに戻す。
  max_price_yen: 3000000        # これを超える物件は収集しない (2026-07: 500万→300万に変更)
  include_price_unknown: false  # 「価格応相談」(価格不明)は収集しない

  # リサーチ範囲 (2026-07 ユーザー指定: アットホームのチェック地域と同じ)
  # ここに無い市町村(離島・枕崎・阿久根・指宿など)の物件は収集時に外す。
  # 住所が読み取れない物件は念のため残す(落としすぎ防止)。
  target_areas:
    - 鹿児島市
    - 鹿屋市
    - 出水市
    - 垂水市
    - 薩摩川内市
    - 日置市
    - 曽於市
    - 霧島市
    - いちき串木野市
    - 南さつま市
    - 志布志市
    - 南九州市
    - 伊佐市
    - 姶良市
    - さつま町
    - 湧水町
    - 大崎町
    - 東串良町
    - 南大隅町
    - 肝付町
    # 宮崎県側 (2026-07 アットホーム登録に合わせる)
    - 宮崎市
    - 都城市
    - 小林市
    - えびの市

  # 注力エリア (範囲内でもさらに点数を上乗せする市)
  priority_cities:
    - 薩摩川内市
    - 鹿屋市
    - 出水市
    - 都城市
    - 霧島市
    - 鹿児島市
  # キーワード群は criteria.py にデフォルトあり。上書きしたい場合のみ記述:
  # zanchi_keywords: [残置物, 家財, ...]
  # motive_keywords: [相続, 空き家, ...]
  # convenience_keywords: [スーパー, 小学校, ...]

sources:
  # ── 追跡リスト: ユーザー指名物件のページ直接ウォッチ ──
  # 指名物件は常に⭐キープ扱い・足切り免除。値下げ/記載変更/掲載終了を即通知。
  - id: watchlist
    type: watch
    enabled: true
    entries:
      - url: "https://akiya.sumai.biz/117604"
        note: "ユーザー指名 2026-07-27 伊佐市大口牛尾・ステンドグラスの家。07-28写真鑑定: 生活まるごと残置(飾り棚満杯・寝具・高額家電そのまま)=抜かれ度低。玄関にブロンズ・胸像・大理石花台、洋風富裕。手すり有→高齢者が施設/他界の型。内見で飾り棚の食器ブランドとシャッター車庫の中を確認。07-29方針: 上限100万厳守・家財ごと即決を提示。07-30市バンクページ判明: ①借地権物件(地代年2万・土地は他人。譲渡承諾/解体返還義務を電話で要確認、指値の最強材料) ②2025-10に660万→300万へ値下げ済み・掲載10ヶ月(売主は譲歩済みで疲弊) ③市の内見記事に洋酒大棚・良質スピーカー・振り子時計・カラオケ一式(家財込み公認)。媒介MAYA不動産0995-22-5724。内見で洋酒ラベルとスピーカーのメーカー、簡易水道の水質を確認。07-30借地の整理: 旧法借地なら地主は原則追い出せない(建物買取請求権あり)。要確認=定期借地でないか・契約書の有無・地代滞納厳禁・買ったら建物登記。本命手=地主に底地買い打診(数十万で完全所有権になる可能性)。07-31電話結果で決着: 仲介業者の対応いまいち+家主が家財を自身で処分/売却予定→残置物プレー消滅、家財込み150万は不成立。追跡は大幅値下げの観測のみ(賃貸基地としての再検討ライン)。学び=売主が家財の価値に気付いている物件では『家財ごと』は強みにならない"
      - url: "https://akiya.sumai.biz/122604"
        note: "ユーザー指名 2026-07-27 → 07-28不動産会社に電話で格下げ: 庭に激古の牛小屋・物置、接道が細い(解体・搬出コスト大)。大幅値下げ(30万以下目安)か0円譲渡の時だけ再検討"

  # ── 動作確認用デモソース(ローカルJSON・ネットワーク不要) ──
  # 本番運用ではOFF。判定ロジックの動作確認をしたいときだけtrueに戻す
  - id: demo
    type: demo
    enabled: false
    path: sample_data/demo_listings.json

  # ── 実サイトの追加例(セレクタは各自治体サイトの開発者ツールで確認して設定) ──
  # 追加前に必ず対象サイトの利用規約と robots.txt を確認すること。
  # 商用ポータル(楽待・健美家・アットホーム等)は規約でスクレイピングを
  # 禁止しているため対象にしない。公式の新着メール通知+保存検索を使うこと。
  #
  # ── Sumai空き家 RSS (全国の空き家バンク集約。値下げがタイトルに明示される) ──
  # 2026-07 接続テスト済み: robots.txt は許可、RSSはサイトが公式に公開。
  # 全国の投稿が流れるが、リサーチ範囲外は target_areas フィルタが落とす。
  - id: sumai_akiya_rss
    type: rss
    enabled: true
    feed_urls:
      - "https://akiya.sumai.biz/feed"
      - "https://akiya.sumai.biz/feed?paged=2"   # 少し過去まで遡って取りこぼし防止

  # ── 自治体空き家バンク: アットホーム共通システム (2026-07 構造確認済み) ──
  # 対象地域では鹿児島市・宮崎市の2自治体が本システムで稼働。
  # must_include: "売" で賃貸掲載を除外(売買のみ通知対象)。
  - id: kagoshima_city_akiya_bank
    type: generic_html
    enabled: true
    list_url: "https://kagoshima-c46201.akiya-athome.jp/"
    item_selector: "ul.property-simple > li"
    must_include: "売"
    fields:
      title:       {selector: ".property-name a", attr: "text"}
      url:         {selector: ".property-name a", attr: "href"}
      price:       {selector: "dl.bukken-info dd.price-strong", attr: "text"}
      layout:      {selector: "dl.bukken-info dd:nth-of-type(2)", attr: "text"}
      land_area:   {selector: "dl.bukken-info dd:nth-of-type(3)", attr: "text"}
      address:     {selector: "dl.bukken-info dd:nth-of-type(4)", attr: "text"}
      description: {selector: "dl.bukken-info", attr: "text"}

  - id: miyazaki_city_akiya_bank
    type: generic_html
    enabled: true
    list_url: "https://miyazaki-c45201.akiya-athome.jp/"
    item_selector: "ul.property-simple > li"
    must_include: "売"
    fields:
      title:       {selector: ".property-name a", attr: "text"}
      url:         {selector: ".property-name a", attr: "href"}
      price:       {selector: "dl.bukken-info dd.price-strong", attr: "text"}
      layout:      {selector: "dl.bukken-info dd:nth-of-type(2)", attr: "text"}
      land_area:   {selector: "dl.bukken-info dd:nth-of-type(3)", attr: "text"}
      address:     {selector: "dl.bukken-info dd:nth-of-type(4)", attr: "text"}
      description: {selector: "dl.bukken-info", attr: "text"}

  # ── さつま町 空き家情報バンク(売買) (2026-07 構造・robots確認済み) ──
  # robots.txt は存在しない(404)=クロール制限なし。町公式の公開一覧。
  # 値下げは「◯万円から変更」と明示されるため初回取得でも値下げバッジが付く。
  # 50万〜100万円台の格安帯が常時数件あり、足切り(300万)内の物件が多い。
  - id: satsuma_akiya_bank
    type: satsuma_bank
    enabled: true
    list_url: "https://www.satsuma-net.jp/teiju/akiya/1/5623.html"

  # ── 霧島市 空き家バンク(地区別一覧・売買のみ) (2026-07 構造確認済み) ──
  # 市サーバはkeep-aliveを切ることがあるためアダプタ側で毎回接続を張り直す。
  # 300万以下は少なめだが、地元(本拠地)の一次情報として価値が高い。
  - id: kirishima_akiya_bank
    type: kirishima_bank
    enabled: true
    list_urls:
      - "https://www.city-kirishima.jp/kyodo/shise/ijuteju/akiya/akiyabankkokubu.html"
      - "https://www.city-kirishima.jp/kyodo/shise/ijuteju/akiya/akiyabankmizobe.html"
      - "https://www.city-kirishima.jp/kyodo/shise/ijuteju/akiya/akiyabankmakizono.html"
      - "https://www.city-kirishima.jp/kyodo/shise/ijuteju/akiya/akiyabankyokogawa.html"
      - "https://www.city-kirishima.jp/kyodo/shise/ijuteju/akiya/akiyabankhayato.html"
      - "https://www.city-kirishima.jp/kyodo/shise/ijuteju/akiya/akiyabankutourokuhukuyama.html"
      - "https://www.city-kirishima.jp/kyodo/shise/ijuteju/akiya/akiyabankkirishima.html"

  # ── 姶良市 空き家バンク(売買・戸建) (2026-08 構造確認済み・◎30分圏) ──
  # アットホーム共通システムの新型(メニュー型)。一覧は /buy/house/... 配下。
  # 売買戸建のみ監視(土地のみは対象外の方針)。robots.txtなし(404)確認済み。
  - id: aira_akiya_bank
    type: generic_html
    enabled: true
    list_url: "https://aira-c46225.akiya-athome.jp/buy/house/area/kagoshimaken/airashi/list?gyosei_cd[]=46225"
    item_selector: "ul.property-list-one > li"
    fields: &athome_new_fields
      title:       {selector: 'dt a', attr: "text"}
      url:         {selector: 'dt a', attr: "href"}
      price:       {selector: 'td.price-strong', attr: "text"}
      layout:      {selector: 'td[data-column="madori"]', attr: "text"}
      land_area:   {selector: 'td[data-column="menseki"]', attr: "text"}
      address:     {selector: 'li[data-column="address"]', attr: "text"}
      description: {selector: 'dd.detail-info', attr: "text"}

  # ── 出水市 空き家バンク(売買・戸建) (2026-08 構造確認済み・21件稼働中) ──
  # 1ページ20件表示のため2ページまで読む(20件超が続くなら3ページ目を足す)。
  # 50万4DK・70万3LDKなど格安帯が常時ある優良ソース。
  - id: izumi_akiya_bank
    type: generic_html
    enabled: true
    list_urls:
      - "https://izumi-c46208.akiya-athome.jp/buy/house/area/kagoshimaken/izumishi/list?gyosei_cd[]=46208"
      - "https://izumi-c46208.akiya-athome.jp/buy/house/area/kagoshimaken/izumishi/list?gyosei_cd[]=46208&page=2"
    item_selector: "ul.property-list-one > li"
    fields: *athome_new_fields

  # ── 薩摩川内市 空き家バンク(売買・戸建) (2026-08 構造確認済み・3件稼働) ──
  - id: satsumasendai_akiya_bank
    type: generic_html
    enabled: true
    list_url: "https://satsumasendai-c46215.akiya-athome.jp/buy/house/area/kagoshimaken/satsumasendaishi/list?gyosei_cd[]=46215"
    item_selector: "ul.property-list-one > li"
    fields: *athome_new_fields

  # ── いちき串木野市 空き家バンク(売買・戸建) (2026-08 構造確認済み・20件稼働) ──
  # 50万7DK・150万4K等の格安帯が厚い。ちょうど20件=1頁上限のため2頁目も読む。
  - id: ichikikushikino_akiya_bank
    type: generic_html
    enabled: true
    list_urls:
      - "https://ichikikushikino-c46219.akiya-athome.jp/buy/house/area/kagoshimaken/ichikikushikinoshi/list?gyosei_cd[]=46219"
      - "https://ichikikushikino-c46219.akiya-athome.jp/buy/house/area/kagoshimaken/ichikikushikinoshi/list?gyosei_cd[]=46219&page=2"
    item_selector: "ul.property-list-one > li"
    fields: *athome_new_fields

  # ── 鹿屋・伊佐・曽於・都城 (2026-08 偵察済み: 現在売戸建の掲載0件) ──
  # システムは出水・姶良と同型で読めることを確認済み(伊佐の賃貸で実証)。
  # 掲載が現れた瞬間に自動で拾うための「待ち網」として登録しておく。
  - id: kanoya_akiya_bank
    type: generic_html
    enabled: true
    list_url: "https://kanoya-c46203.akiya-athome.jp/buy/house/area/kagoshimaken/kanoyashi/list?gyosei_cd[]=46203"
    item_selector: "ul.property-list-one > li"
    fields: *athome_new_fields

  - id: isa_akiya_bank
    type: generic_html
    enabled: true
    list_url: "https://isa-c46224.akiya-athome.jp/buy/house/area/kagoshimaken/isashi/list?gyosei_cd[]=46224"
    item_selector: "ul.property-list-one > li"
    fields: *athome_new_fields

  - id: soo_akiya_bank
    type: generic_html
    enabled: true
    list_url: "https://soo-c46217.akiya-athome.jp/buy/house/area/kagoshimaken/sooshi/list?gyosei_cd[]=46217"
    item_selector: "ul.property-list-one > li"
    fields: *athome_new_fields

  - id: miyakonojo_akiya_bank
    type: generic_html
    enabled: true
    list_url: "https://miyakonojo-c45202.akiya-athome.jp/buy/house/area/miyazakiken/miyakonojoshi/list?gyosei_cd[]=45202"
    item_selector: "ul.property-list-one > li"
    fields: *athome_new_fields

  # ── 都城市 空き家バンク(移住サイト「住めば住むほど都城」) (2026-08 構造確認済み) ──
  # アットホーム系(下の待ち網)は空で、本体はこちらに移行していた。
  # URLに管理番号・種別・地区が入る形式。売買のみ・詳細ページから価格取得。
  - id: miyakonojo_sumeba_bank
    type: miyakonojo_bank
    enabled: true
    list_url: "https://www.sumeba-sumuhodo-miyakonojo.jp/residence/"

  # ── 湧水町 空家バンク(売買のみ) (2026-08 構造確認済み・◎30分圏) ──
  # No.xxx+売買価格+［地区名］が表セルで並ぶ町独自ページ。
  # 全角数字・「応相談」・Noと価格が別strongの物件あり(アダプタで吸収)。
  # 空地バンク(789.html)は土地のみのため対象外。
  - id: yusui_akiya_bank
    type: yusui_bank
    enabled: true
    list_url: "https://www.town.yusui.kagoshima.jp/soshiki/34/787.html"

  # ── Gmailメール解析(楽待・アットホーム・SUUMO等のポータルを規約違反なしにカバー) ──
  # アドレスは環境変数 GMAIL_USERNAME、パスワードは GMAIL_APP_PASSWORD から読む。
  - id: gmail_portal_mail
    type: gmail_imap
    enabled: true
    username_env: GMAIL_USERNAME
    folder: "bukken"        # 通知メールを振り分けるGmailラベル
    lookback_days: 3        # 直近何日分のメールを読むか(差分検知が重複を吸収する)

  # ── ジモティー(個人間の格安・0円物件) ──
  # 有効化する前に必ず https://jmty.jp/robots.txt と利用規約を確認すること。
  # 規約が自動取得を禁じている場合は有効化せず、サイト内の検索条件保存や
  # 公式のメール通知機能を使う(メール解析方式で合流させる)。
  # - id: jimoty_kagoshima_estate
  #   type: generic_html
  #   enabled: false
  #   list_url: "https://jmty.jp/kagoshima/est-sal"
  #   item_selector: "確認して設定"
  #   fields: {}

  # - id: satsumasendai_akiya_bank
  #   type: generic_html
  #   enabled: false
  #   list_url: "https://www.example.lg.jp/akiya-bank/list.html"
  #   item_selector: "div.property-card"
  #   fields:
  #     title:       {selector: "h3 a", attr: "text"}
  #     url:         {selector: "h3 a", attr: "href"}
  #     price:       {selector: ".price", attr: "text"}
  #     address:     {selector: ".address", attr: "text"}
  #     layout:      {selector: ".layout", attr: "text"}
  #     floor_area:  {selector: ".floor-area", attr: "text"}
  #     land_area:   {selector: ".land-area", attr: "text"}
  #     toilet:      {selector: ".equipment", attr: "text"}
  #     description: {selector: ".note", attr: "text"}
