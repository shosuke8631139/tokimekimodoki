# 空き家ウォッチャー: 週次ダイジェスト (日曜 朝8時 JST)
name: akiya-digest

on:
  schedule:
    - cron: '0 23 * * 6'   # 土曜23時UTC = 日曜8時JST
  workflow_dispatch: {}

concurrency:
  group: akiya-watcher-db
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依存インストール
        run: pip install -r akiya-watcher/requirements.txt
      - name: ダイジェスト送信
        working-directory: akiya-watcher
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m akiya_watcher.main --config config.yaml --digest
