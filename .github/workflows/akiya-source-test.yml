# 新しい情報源の接続テスト (手動実行のみ。DB・通知は使わない読み取りテスト)
name: akiya-source-test

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依存インストール
        run: pip install -r akiya-watcher/requirements.txt pypdf
      - name: 空き家バンク利用登録の手続き偵察
        working-directory: akiya-watcher
        run: python scripts/test_akiyabank_touroku.py
