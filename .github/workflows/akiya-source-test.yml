# 新しい情報源の接続テスト (手動実行のみ。DB・通知は使わない読み取りテスト)
name: akiya-source-test

on:
  workflow_dispatch: {}

permissions:
  contents: read
  models: read   # GitHub Models (無料AI推論) を GITHUB_TOKEN で呼ぶため

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依存インストール
        run: pip install -r akiya-watcher/requirements.txt
      - name: 日置市の指名2物件を一覧・詳細で統合確認
        working-directory: akiya-watcher
        run: python scripts/test_aira_yusui_source.py
