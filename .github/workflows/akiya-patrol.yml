# 空き家ウォッチャー: クラウド巡回 (JST 9時・12時・15時・18時)
#
# 有効化に必要なこと:
#   1. このワークフローが既定ブランチ(main)に入っていること
#   2. リポジトリの Settings > Secrets and variables > Actions に
#      GMAIL_APP_PASSWORD を登録すること (メール通知・メール解析に使用)
#   3. akiya-watcher/config.yaml の notify.email / gmail ソースを設定すること
#
# 注意: クラウドのIPは一部サイトにブロックされることがある。
# その場合、そのソースは自宅PCでの実行に切り替える(併用可能。DBは共有される)。
name: akiya-patrol

on:
  schedule:
    - cron: '0 0,3,6,9 * * *'   # UTC 0,3,6,9 = 日本時間 9,12,15,18時
  workflow_dispatch: {}          # 手動実行も可能

concurrency:
  group: akiya-watcher-db
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依存インストール
        run: pip install -r akiya-watcher/requirements.txt
      - name: 巡回実行
        working-directory: akiya-watcher
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m akiya_watcher.main --config config.yaml --report data/report.html
      - name: 巡回データを保存 (値下げ検知は履歴が命)
        run: |
          git config user.name "akiya-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add -f akiya-watcher/data/listings.db akiya-watcher/data/report.html
          git diff --cached --quiet || git commit -m "巡回データ更新 [skip ci]"
          git push
