# 空き家ウォッチャー: クラウド巡回 (JST 9時・12時・15時・18時)
#
# 有効化に必要なこと:
#   1. このワークフローが既定ブランチ(main)に入っていること
#   2. リポジトリの Settings > Secrets and variables > Actions に登録:
#        GMAIL_USERNAME      … 自分のGmailアドレス
#        GMAIL_APP_PASSWORD  … Gmailのアプリパスワード(空白なしの16文字)
#
# 巡回データ(listings.db)は Actions のキャッシュに保存する。
# 公開リポジトリに個人の物件データ・レポートをコミットしないため。
# レポートは通知メールに添付されて届く。
#
# 注意: クラウドのIPは一部サイトにブロックされることがある。
# その場合そのソースは自宅PC実行に切り替える(併用可)。
name: akiya-patrol

on:
  schedule:
    # 毎時0分ちょうどはGitHub全体の予約が集中しスキップされることがあるため
    # 23分にずらす。UTC 0,3,6,9時台 = 日本時間 9:23, 12:23, 15:23, 18:23
    - cron: '23 0,3,6,9 * * *'
    # 朝の便の予備 (9:53 / 10:23 JST)。GitHubの定時実行は遅延・スキップが
    # あるため朝だけ三段構え。生存報告は1日1回ガードがあり重複しない
    - cron: '53 0 * * *'
    - cron: '23 1 * * *'
  workflow_dispatch: {}          # 手動実行も可能

concurrency:
  group: akiya-watcher-db
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依存インストール
        run: pip install -r akiya-watcher/requirements.txt
      - name: 前回までの巡回データを復元
        uses: actions/cache/restore@v4
        with:
          path: akiya-watcher/data
          key: akiya-db-${{ github.run_id }}
          restore-keys: |
            akiya-db-
      - name: 巡回実行
        working-directory: akiya-watcher
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # 通知の宛先を送信元と別にしたい場合のみ設定 (未設定なら自分宛て)
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python -m akiya_watcher.main --config config.yaml --report data/report.html
      - name: 巡回データを保存 (値下げ検知は履歴が命)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: akiya-watcher/data
          key: akiya-db-${{ github.run_id }}
